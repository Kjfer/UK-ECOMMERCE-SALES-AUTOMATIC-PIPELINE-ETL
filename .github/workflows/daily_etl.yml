name: Daily ETL

on:
  schedule:
    # Runs every day at 02:00 UTC (adjust to your preferred time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      commit_outputs:
        description: 'If true, the workflow will commit generated CSVs back to the repo'
        required: false
        default: 'false'

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      COMMIT_PROCESSED: ${{ github.event.inputs.commit_outputs || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # allow pushing with GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ETL pipeline
        run: |
          python -m src.pipeline --raw-dir data/raw --out-dir data/processed --sqlite false

      - name: Commit processed CSVs to branch processed-data (optional)
        if: env.COMMIT_PROCESSED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          # create or reset local branch processed-data
          git checkout -B processed-data
          git add data/processed/*.csv || true
          git commit -m "Add processed CSVs from scheduled ETL [skip ci]" || echo "No changes to commit"
          # push to a separate branch to avoid triggering this scheduled workflow again
          git push -u origin processed-data --force
