name: Daily ETL

on:
  schedule:
    # Runs every day at 02:00 UTC (adjust to your preferred time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      commit_outputs:
        description: 'If true, the workflow will commit generated CSVs back to the repo'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-etl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMIT_PROCESSED: ${{ github.event.inputs.commit_outputs || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ETL pipeline
        run: |
          python -m src.pipeline --raw-dir data/raw --out-dir data/processed

      - name: Upload processed CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-csvs-${{ github.run_id }}
          path: data/processed/*.csv

      - name: Commit processed CSVs to branch processed-data (optional)
        if: env.COMMIT_PROCESSED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B processed-data
          git add data/processed/*.csv || true
          git commit -m "Add processed CSVs from scheduled ETL [skip ci]" || echo "No changes to commit"
          git push -u origin processed-data --force
